<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Scores | Math Timings</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"></header>
<main class="history-page"><section class="history-heading"><span aria-hidden="true">★</span><div><p class="eyebrow">Practice history</p><h1>My Scores</h1><p>Review past rounds and choose one to practice again.</p></div></section><div class="table-card"><table id="history-table"><thead><tr><th>Date</th><th>Practice</th><th>Correct</th><th>Missed</th><th>Answered</th><th>Coins</th></tr></thead><tbody></tbody></table></div></main>
<script src="app-data.js"></script><script src="site-shell.js"></script><script>
const tableBody=document.querySelector("#history-table tbody"),history=JSON.parse(localStorage.getItem("testHistory")||"[]");if(!history.length){const row=document.createElement("tr");row.innerHTML='<td class="empty-history" colspan="6">No practice history yet. Your completed rounds will show here.</td>';tableBody.appendChild(row)}else{history.reverse().forEach(entry=>{const row=document.createElement("tr"),date=new Date(entry.startTime).toLocaleString();row.innerHTML=`<td data-label="Date">${date}</td><td data-label="Practice">${entry.testType}</td><td data-label="Correct"><strong>${entry.correct}</strong> / 30</td><td data-label="Missed">${entry.missed}</td><td data-label="Answered">${entry.answered}</td><td data-label="Coins">${entry.coinsEarned||0}</td>`;tableBody.appendChild(row)})}
</script></body></html>
